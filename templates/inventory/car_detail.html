<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تفاصيل السيارة</title>
</head>
<body>
    <h2>{{ car.brand }} {{ car.model }}</h2>
    <p>السنة: {{ car.year }}</p>
    <p>السعر: {{ car.price }} ريال</p>
    <p>المالك: {{ car.owner.username }}</p>
    <p>الحالة: {% if car.is_available %}متوفرة{% else %}غير متوفرة{% endif %}</p>

    {% if car.image %}
        <img src="{{ car.image.url }}" alt="صورة السيارة" width="400">
    {% else %}
        <p>لا توجد صورة</p>
    {% endif %}

    <p><a href="{% url 'inventory:cars_list' %}">رجوع إلى القائمة</a></p>
</body>
</html>
