<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>قائمة السيارات المتوفرة</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f7;
            margin: 0;
            padding: 30px;
            direction: rtl;
        }

        h1 {
            text-align: center;
            color: #1565c0;
            margin-bottom: 40px;
        }

        .cars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .car-card {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: right;
        }

        .car-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .car-card h3 {
            margin: 5px 0;
            color: #1565c0;
            font-size: 18px;
        }

        .car-card p {
            margin: 4px 0;
            font-size: 14px;
        }

        .car-card a {
            display: inline-block;
            margin-top: 10px;
            color: #2196f3;
            text-decoration: none;
            font-weight: bold;
        }

        .no-cars {
            text-align: center;
            font-size: 18px;
            color: #888;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <h1>🚗 السيارات المتوفرة</h1>

    {% if cars %}
    <div class="cars-grid">
        {% for car in cars %}
            <div class="car-card">
                {% if car.image %}
                    <img src="{{ car.image.url }}" alt="صورة {{ car.brand }}">
                {% else %}
                    <img src="https://via.placeholder.com/300x180?text=No+Image" alt="لا توجد صورة">
                {% endif %}
                <h3>{{ car.brand }} {{ car.model }}</h3>
                <p>السنة: {{ car.year }}</p>
                <p>السعر: {{ car.price }} ريال</p>
                <a href="{% url 'inventory:car_detail' car.id %}">عرض التفاصيل</a>
            </div>
        {% endfor %}
    </div>
    {% else %}
        <div class="no-cars">لا توجد سيارات متوفرة حالياً.</div>
    {% endif %}

</body>
</html>
